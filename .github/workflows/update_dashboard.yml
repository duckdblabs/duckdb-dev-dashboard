name: Update Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
   - cron: '0 */4 * * *'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ducklake storage credentials (also use for cloudflare):
  DUCKLAKE_STORAGE_S3_KEY_ID: ${{ secrets.DUCKLAKE_STORAGE_S3_KEY_ID }}
  DUCKLAKE_STORAGE_S3_SECRET: ${{ secrets.DUCKLAKE_STORAGE_S3_SECRET }}
  DUCKLAKE_STORAGE_S3_ENDPOINT: ${{ secrets.DUCKLAKE_STORAGE_S3_ENDPOINT }}
  DUCKLAKE_STORAGE_R2_ACCOUNT_ID: ${{ secrets.DUCKLAKE_STORAGE_R2_ACCOUNT_ID }}

  # ducklake catalog credentials:
  DUCKLAKE_CATALOG_PG_HOST: ${{ secrets.DUCKLAKE_CATALOG_PG_HOST }}
  DUCKLAKE_CATALOG_PG_USER: ${{ secrets.DUCKLAKE_CATALOG_PG_USER }}
  DUCKLAKE_CATALOG_PG_PASSWORD: ${{ secrets.DUCKLAKE_CATALOG_PG_PASSWORD }}

  # aws s3 credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # benchmark results lake (read-only): s3://duckdb-benchmark-lake-847122343688, eu-central-1
  # read by 'make generate_sources' in the build job, for the benchmarks dashboard
  BENCHMARK_LAKE_S3_KEY_ID: ${{ secrets.BENCHMARK_LAKE_S3_KEY_ID }}
  BENCHMARK_LAKE_S3_SECRET: ${{ secrets.BENCHMARK_LAKE_S3_SECRET }}

  # cloudflare (same as ducklake storage)
  CF_KEY_ID: ${{ secrets.CF_KEY_ID }}
  CF_KEY_SECRET: ${{ secrets.CF_KEY_SECRET }}

jobs:
  build:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: make venv
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evidence/package-lock.json
      - name: Install dependencies
        working-directory: ./evidence
        run: npm install
      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          NODE_OPTIONS: "--max_old_space_size=7168"
        run: |
          make secrets
          make generate_sources
          make build
      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'evidence/build'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
